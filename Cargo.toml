[package]
name = "lamina-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Christopher R. Gubbin <cgubbin@gmail.com>"]
description = "Transfer- and scattering-matrix methods for planar electromagnetic systems"
categories = ["science", "mathematics"]
keywords = ["optics", "photonics", "electromagnetics", "transfer-matrix", "scattering-matrix"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cgubbin/lamina-core"
homepage = "https://github.com/cgubbin/lamina-core"
readme = "README.md"
include = ["src/**/*.rs", "examples/**/*.rs", "tests/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE*"]

[lib]
name = "lamina_core"
path = "src/lib.rs"


[dependencies]
itertools = "0.15.0"
nalgebra = "0.33.3"
ndarray = "0.17.2"
num-complex = "0.4.6"
num-traits = "0.2.19"
thiserror = "2.0.18"
lamina-units = { version = "0.1.1", path = "../lamina-units" }

[dev-dependencies]
approx = { version = "0.5.1", features = ["num-complex"] }


[profile.dev]
debug = true

[profile.release]
codegen-units = 1
lto = "thin"

# Optimised test runs: `cargo test --profile release-test`. Full optimisation
# like release, but no LTO and many codegen units so test binaries compile and
# link quickly, with debug assertions kept so tests of them hold.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug-assertions = true

# Debug test builds: optimise dependencies (nalgebra, argloc, sibling crates)
# once and cache them, and lightly optimise this crate, so numerical tests run
# at a usable speed while debug assertions stay on.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[workspace.metadata.release]
tag = true
push = true
publish = true
sign-commit = false

[features]
